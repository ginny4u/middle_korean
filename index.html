:root{
 --bg:#F3F5FC; --card:#FFFFFF; --ink:#2B2D3A; --sub:#8A8FA3; --line:#E6E9F4;
 --main:#5B6CFF; --mainSoft:#EEF0FF; --ok:#22B07D; --okSoft:#E6F7F0;
 --no:#FF6B6B; --noSoft:#FFEEEE; --warm:#FFB84D;
 --sans:'Yet','Apple SD Gothic Neo','Malgun Gothic',serif;
 --ui:'NSQ','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{zoom:var(--z,1);margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.y{font-family:'Yet',serif}
/* 글꼴은 둘뿐이다. 한자나 옛한글이 섞일 수 있는 자리는 전부 명조,
   순 한글만 나오는 껍데기는 시스템 고딕. */
.hero p,.tabs button,.go,.back,.lnk,.bubble,.badge,
.tip,.ask,.prompt,h3,.qtop,.pnum,.count,.top h1,.pick .nm,
.emptyking span,.fin .big,.none,.pct{font-family:var(--ui)}
/* 학교 선택 화면에는 한자도 옛한글도 없다. 명조를 섞지 않고 고딕으로 통일한다.
   (제목만 위의 .hero h1 규칙에 따라 주아체) */
.schoolpick,.schoolpick *{font-family:var(--ui)}
.schoolpick .hero h1,.schoolpick .hero h1 span{font-family:'Jua','NSQ',sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:16px 14px 84px}
button{font-family:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:34px}
.back{border:0;background:var(--card);border-radius:10px;padding:6px 11px;font-size:14px;box-shadow:0 1px 2px rgba(40,50,90,.07)}
.top h1{font-size:17px;margin:0;font-weight:700}
.top .sm{font-size:12px;color:var(--sub);font-weight:400}

/* 머리말은 상자를 없애고 배경에 그대로 얹는다. 캐릭터가 페이지 위에 서 있는 모양. */
.hero{padding:10px 4px 16px;margin-bottom:4px;
  display:flex;align-items:center;justify-content:center;gap:14px}
/* 주아체는 이 제목 하나에만 쓴다. */
.hero h1{margin:0 0 4px;font-family:'Jua','NSQ',sans-serif;font-weight:400;
  font-synthesis:none;-webkit-font-synthesis:none;line-height:1.2}
.hero h1 span{display:block}
.hero h1 .l1{font-size:14.7px}  /* 아랫줄과 가로폭이 같아지는 크기 */
.hero h1 .l2{font-size:22px}
.hero p{margin:0;font-size:13px;color:var(--sub)}
.king{width:96px;height:auto;flex:none;display:block;
  filter:drop-shadow(0 3px 5px rgba(40,50,90,.15))}
.king.sm{width:52px}
.kingrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.bubble{position:relative;background:var(--mainSoft);color:var(--main);border-radius:14px;
  padding:9px 14px;font-size:14.5px;max-width:210px;text-align:left}
.bubble::before{content:'';position:absolute;left:-6px;top:50%;margin-top:-6px;
  border:6px solid transparent;border-right-color:var(--mainSoft);border-left:0}
.emptyking{display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 0}
.emptyking img{width:44px}
.emptyking span{font-size:13px;color:var(--sub)}
/* 어느 화면에서나 글자 크기를 바꿀 수 있게 아래에 고정한다 */
#zoombar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(243,245,252,.94);
  border-top:1px solid var(--line);padding:7px 14px calc(7px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:center;gap:6px}
#zoombar .lb{font-size:12.5px;color:var(--sub);font-family:var(--ui);margin-right:4px}
#zoombar button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  padding:7px 13px;font-size:13.5px;font-family:var(--ui);color:var(--sub)}
#zoombar button.on{border-color:var(--main);background:var(--mainSoft);color:var(--main)}

 이"], "n": "六龍(육룡)+이. 조선 창업의 주역인 여섯 임금을 가리킨다. 앞말이 자음으로 끝나 주격 조사 이가 쓰였다.", "p": "六龍(육룡) + 이"}, {"f": "일마다", "m": "일마다", "t": ["보조사"], "n": "일+마다. 마다는 보조사다.", "p": "일 + 마다"}, {"f": "天福(천복)이시니", "m": "하늘의 복이시니", "t": ["주체높임 선어말어미"], "n": "天福(천복)+이-+-시-+-니. -시-는 자음 어미 앞에, -샤-는 모음 어미 앞에 쓰인다.", "p": "天福(천복) + 이- + -시- + -니"}, {"f": "古聖(고성)이", "m": "옛 성인과", "t": ["비교 부사격조사"], "n": "여기서 이는 주격이 아니라 오늘날의 와/과에 해당하는 비교 부사격 조사다.", "p": "古聖(고성) + 이"}, {"f": "同符(동부)ᄒᆞ시니", "m": "꼭 들어맞으시니", "t": ["주체높임 선어말어미"], "n": "同符(동부)ᄒᆞ-+-시-+-니.", "p": "同符(동부)ᄒᆞ- + -시- + -니"}]}, {"id": "yong2", "title": "용비어천가 2장", "sub": "불휘 기픈 남ᄀᆞᆫ", "text": "불휘 기픈 남ᄀᆞᆫ ᄇᆞᄅᆞ매 아니 뮐ᄊᆡ 곶 됴코 여름 하ᄂᆞ니 ᄉᆡ미 기픈 므른 ᄀᆞᄆᆞ래 아니 그츨ᄊᆡ 내히 이러 바ᄅᆞ래 가ᄂᆞ니", "trans": "뿌리가 깊은 나무는 바람에 아니 흔들리므로 꽃이 좋고 열매가 많으니, 샘이 깊은 물은 가뭄에 아니 그치므로 내가 이루어져 바다에 가느니", "cards": [{"f": "불휘", "m": "뿌리가", "t": ["주격조사 Ø"], "n": "ㅣ 모음으로 끝난 체언 뒤라 주격 조사가 표기되지 않았다. 표기에는 없어도 발음은 되었다.", "p": "불휘 + Ø(영형태)"}, {"f": "기픈", "m": "깊은", "t": ["이어적기(연철)"], "n": "깊-+-은. 받침을 내려 적었다.", "p": "깊- + -은"}, {"f": "남ᄀᆞᆫ", "m": "나무는", "t": ["ㄱ곡용 체언", "이어적기(연철)", "모음조화", "보조사"], "n": "오늘날 나무에 해당하는 말은 나모인데, 모음으로 시작하는 조사와 만나면 남ㄱ으로 바뀐다. 이를 ㄱ 곡용이라 한다.", "p": "남ㄱ + ᄋᆞᆫ"}, {"f": "ᄇᆞᄅᆞ매", "m": "바람에", "t": ["원인 부사격조사", "이어적기(연철)", "모음조화"], "n": "ᄇᆞᄅᆞᆷ+애. 양성 모음 ㆍ와 어울리는 애가 쓰였다. 나라에 닥친 시련을 뜻한다.", "p": "ᄇᆞᄅᆞᆷ + 애"}, {"f": "뮐ᄊᆡ", "m": "흔들리므로", "t": ["이유의 연결어미"], "n": "뮈-+-ㄹᄊᆡ.", "p": "뮈- + -ㄹᄊᆡ"}, {"f": "곶", "m": "꽃이", "t": ["종성부용초성", "주격조사 생략"], "n": "곳으로 적었다면 8종성법이지만 곶으로 원형을 밝혀 종성부용초성을 따랐다. 자음으로 끝나 주격 조사 이가 붙어야 하지만 그냥 생략되었다. 문화를 뜻하는 비유.", "p": "곶 + (주격 조사 생략)"}, {"f": "됴코", "m": "좋고", "t": ["구개음화 안 일어남", "이어적기(연철)"], "n": "둏-+-고. 어간의 종성 ㅎ을 뒤 음절 초성으로 내려 ㄱ과 어울려 ㅋ으로 적었다. 됴가 죠로 바뀌지 않은 것은 아직 구개음화가 없었기 때문이다.", "p": "둏- + -고"}, {"f": "여름", "m": "열매", "t": ["명사 파생 접미사", "이어적기(연철)"], "n": "열-+-음. 어간 열-에 명사 파생 접미사 -음이 붙어 만들어진 명사다. 세종어제훈민정음의 ᄡᅮ메는 -움이 붙은 명사형 어미라 층위가 다르다. 파생 접미사는 -ᄋᆞᆷ/-음, 명사형 어미는 -옴/-움이다. 여기서 여름은 문화를 뜻하는 비유다.", "p": "열- + -음"}, {"f": "하ᄂᆞ니", "m": "많으니", "t": ["사라진 말", "현재시제 선어말어미"], "n": " var S = {stats:{}, cards:{}, pairs:{}};
try { var raw = localStorage.getItem('mk_v1'); if (raw) S = JSON.parse(raw); } catch(e){}
var ZOOMS = [['작게',0.9],['보통',1],['크게',1.15]];
function applyZoom(){ document.body.style.setProperty('--z', S.zoom || 1); }
function drawZoomBar(){
  var bar = document.getElementById('zoombar');
  bar.innerHTML = '<span class="lb">글자 크기</span>' + ZOOMS.map(function(z, i){
    return '<button data-z="'+i+'"'+((S.zoom || 1) === z[1] ? ' class="on"' : '')+'>'+z[0]+'</button>';
  }).join('');
  Array.prototype.forEach.call(bar.querySelectorAll('button'), function(b){
    b.onclick = function(){
      S.zoom = ZOOMS[+b.getAttribute('data-z')][1];
      save(); applyZoom(); drawZoomBar();   // 화면은 그대로 두고 배율만 바꾼다
    };
  });
}
function save(){ try { localStorage.setItem('mk_v1', JSON.stringify(S)); } catch(e){} }
function school(){ return SCHOOLS.filter(function(x){ return x.id === S.school; })[0] || null; }
function myWorks(){
  var sc = school();
  if (!sc) return WORKS;
  return WORKS.filter(function(w){ return sc.works.indexOf(w.id) >= 0; });
}
function cardState(k){ return S.cards[k] || (S.cards[k] = {streak:0, wrong:0, last:null}); }
function tagState(t){ return S.stats[t] || (S.stats[t] = {seen:0, hit:0}); }

/* ---------- 옛한글 폰트 강제 ---------- */
var JAMO = /[\u1100-\u11FF\uA960-\uA97F\uD7B0-\uD7FF]/;
var RUN = /[\uAC00-\uD7A3\u1100-\u11FF\uA960-\uA97F\uD7B0-\uD7FF]+/g;
function esc(s){ return String(s).replace(/[&<>]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]; }); }
function mk(s){
  var out='', last=0, m; RUN.lastIndex=0;
  while ((m = RUN.exec(s)) !== null){
    out += esc(s.slice(last, m.index));
    out += JAMO.test(m[0]) ? '<span class="y">'+esc(m[0])+'</span>' : esc(m[0]);
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));

function kingImg(cls){ return '<img class="king'+(cls?' '+cls:'')+'" src="'+KING+'" alt="지니대왕">'; }
function hero(sub){
  return '<div class="hero">' + kingImg() + '<div>'
    + '<h1><span class="l1">지니대왕과 함께하는</span><span class="l2">중세국어 연습</span></h1><p>' + sub + '</p></div></div>';
}

var $ = function(id){ return document.getElementById(id); };
var V = function(){ return $('view'); };
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function allCards(){
  var r=[]; myWorks().forEach(function(w){ w.cards.forEach(function(c,i){ r.push({w:w, c:c, k:w.id+':'+i}); }); }); return r;
}
function workCards(w){ return w.cards.map(function(c,i){ return {w:w, c:c, k:w.id+':'+i}; }); }
function mastered(list){ var n=0; list.forEach(function(x){ if ((S.cards[x.k]||{}).streak >= 2) n++; }); return n; }
function setTop(show, title, sub, onBack){
  $('top').className = show ? 'top' : 'top hide';
  if (show){ $('ttl').innerHTML = mk(title); $('back').onclick = onBack; }
}

/* ---------- 홈 ---------- */
function pickSchool(){
  setTop(false);
  var h = hero('다니는 학교를 고르거라. 시험 범위에 맞는 작품만 내어 주마.') + '<div class="pick">';
  SCHOOLS.forEach(function(sc){
    var names = WORKS.filter(function(w){ return sc.works.indexOf(w.id) >= 0; })
                     .map(function(w){ return w.title; }).join(' · ');
    var now = sc.id === S.school;
    h += '<button data-s="'+sc.id+'"'+(now ? ' class="cur"' : '')+'><div class="nm">'+mk(sc.name)
      + (now ? '<span class="badge">지금 선택됨</span>' : '')
      + '</div><div class="ds">'+mk(names)+'</div></button>';
  });
  h += '</div>';
  if (S.school) h += '<div class="tip">학교를 바꿔도 지금까지 푼 기록은 그대로 남습니다.</div>';
  V().innerHTML = '<div class="schoolpick">' + h + '</div>';
  Array.prototype.forEach.call(V().querySelectorAll('.pick button'), function(b){
    b.onclick = function(){ S.school = b.getAttribute('data-s'); save(); home(); };

function weakTags(n){
  var known = {};
  for (var k in TAGS) TAGS[k].forEach(function(t){ known[t] = 1; });
  var r=[]; for (var t in S.stats){ var s=S.stats[t];
    if (known[t] && s.seen>=2) r.push([t, s.hit/s.seen, s.seen]); }
  r.sort(function(a,b){ return a[1]-b[1]; });
  return r.slice(0, n);
}

function readTab(){
  var w = curWork, idx = {};
  w.cards.forEach(function(c,i){ idx[c.f] = i; });
  var keys = Object.keys(idx).sort(function(a,b){ return b.length-a.length; });
  var txt = w.text, out = '', i = 0, buf = '';
  function flush(){ if (buf){ out += mk(buf); buf = ''; } }
  while (i < txt.length){
    var hit = null;
    // 어절 경계에서만 매칭한다. 그래야 ᄆᆞᄎᆞᆷ내 안의 '내'가 주격 조사 카드로 잡히지 않는다.
    if (i === 0 || txt.charAt(i-1) === ' '){
      for (var q=0; q<keys.length; q++){
        var kk = keys[q];
        if (txt.substr(i, kk.length) === kk){
          var after = txt.charAt(i + kk.length);
          if (after === '' || after === ' '){ hit = kk; break; }
        }
      }
    }
    // 카드가 아닌 부분은 한 덩어리로 모아서 내보낸다. 낱글자로 쪼개면 옛한글 조합이 깨진다.
    if (hit){ flush(); out += '<span data-i="'+idx[hit]+'">'+mk(hit)+'</span>'; i += hit.length; }
    else { buf += txt.charAt(i); i++; }
  }
  flush();
  $('body').innerHTML = '<div class="box"><div class="orig">'+out+'</div><div class="trans">'+mk(w.trans)+'</div>'
    + '<div id="peek"></div></div>'
    + '<div class="tip">밑줄 있는 어절을 누르면 분석이 열립니다.</div>';
  var orig = $('body').querySelector('.orig');
  orig.onclick = function(ev){
    // 옛한글 조합용 span 안쪽을 눌러도 바깥의 어절 span을 찾아 올라간다
    var t = ev.target;
    while (t && t !== orig && !(t.getAttribute && t.getAttribute('data-i') !== null)) t = t.parentNode;
    if (!t || t === orig) return;
    var hits = orig.querySelectorAll('span[data-i]');
    Array.prototype.forEach.call(hits, function(x){ x.classList.remove('sel'); });
    t.classList.add('sel');
    var c = w.cards[+t.getAttribute('data-i')];
    $('peek').innerHTML = '<div class="peek"><b class="y">'+esc(c.f)+'</b> &nbsp;'+mk(c.m)
      + '<div class="pz"><em>형태소 분석</em>'+mk(c.p)+'</div>'
      + '<div class="tg">'+c.t.map(function(x){ return '<span>'+mk(x)+'</span>'; }).join('')+'</div>'
      + mk(c.n) + '</div>';
  };
}

/* ---------- 문제 ---------- */
var Q = {list:[], queue:[], session:[], cur:null, opts:[], picked:null, graded:false, label:'', n:0};
var SESSION = 5;   // 한 판에 다루는 어절 수. 부담 없이 한 판 돌릴 분량.

// 한 판에 내보낼 어절을 고른다. 무작위가 아니라 약한 것부터.
function pickSession(list, n){
  var pend = list.filter(function(x){ return !((S.cards[x.k]||{}).streak >= 2); });
  if (!pend.length){                      // 다 끝냈으면 처음부터 다시
    list.forEach(function(x){ cardState(x.k).streak = 0; });
    pend = list.slice();
  }
  if (pend.length <= n) return shuffle(pend);
  var wrong = [], fresh = [], rest = [];
  pend.forEach(function(x){
    var st = S.cards[x.k] || {};
    if (st.wrong) wrong.push(x);
    else if (!st.seen) fresh.push(x);
    else rest.push(x);
  });
  var order = shuffle(wrong).concat(shuffle(fresh), shuffle(rest));
  return shuffle(order.slice(0, n));
}

function startQuiz(list, label){
  Q.list = list; Q.label = label; Q.n = 0; Q.right = 0;
  Q.queue = pickSession(list, SESSION);
  Q.session = Q.queue.slice();
  nextQ();
}
// 어절마다 같은 값이 나오는 해시. 오답 후보를 매번 같게 뽑기 위한 것.
function hash(str){
  var h = 0;
  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function fixedOrder(list, key){
  return list.slice().sort(function(a, b){ return hash(key + a) - hash(key + b); });
}

function options(c, key){
  var cats = {}; c.t.forEach(function(t){ cats[CAT[t]] = 1; });
  var need = Math.max(3, 7 - c.t.length);
  // 1순위: 정답과 헷갈리는 태그. 멀리 있는 오답은 개념을 몰라도 지워지므로 문제가 안 된다.
  var near = [];
  c.t.forEach(function(t){
    (GROUPS[t] || []).forEach(function(x){
      if (c.t.indexOf(x) < 0 && near.indexOf(x) < 0) near.push(x);
    });
  });
  // 오답 후보는 어절마다 고정한다. 같은 대조를 반복해 봐야 눈에 익는다.
  near = near.filter(function(t){ return NODIST.indexOf(t) < 0; });
  var picked = fixedOrder(near, key).slice(0, need);
  // 2순위: 모자라면 같은 분류에서 채운다 (이것도 고정)
  if (picked.length < need){
    var prim = Object.keys(cats), pool = [];
    prim.forEach(function(k){ pool = pool.concat(TAGS[k]); });
    pool = fixedOrder(pool.filter(function(t){
      return c.t.indexOf(t) < 0 && picked.indexOf(t) < 0 && NODIST.indexOf(t) < 0;
    }), key);
    picked = picked.concat(pool.slice(0, need - picked.length));
  }
  // 자리만 매번 섞는다. 안 섞으면 위치로 외운다.
  return shuffle(c.t.concat(picked));
}
function nextQ(){
  if (!Q.queue.length) return finish();
  Q.cur = Q.queue[0]; Q.opts = options(Q.cur.c, Q.cur.k); Q.picked = {}; Q.graded = false;
  var h = '<div class="box"><div class="qtop"><span>'+mk(Q.label)+'</span>'
    + '<span>'+(Q.n + 1)+' / '+Q.session.length+'</span></div>'
    + '<div class="word"><div class="f y">'+esc(Q.cur.c.f)+'</div><div class="g" id="gloss">'+mk(Q.cur.c.m)+'</div></div>'
    + '<div class="ask">이 어절에 나타난 것을 모두 고르세요</div>'
    + '<div class="chips" id="chips">'
    + Q.opts.map(function(t){ return '<button class="chip" data-t="'+esc(t)+'" aria-pressed="false">'+mk(t)+'</button>'; }).join('')
    + '</div><div id="res"></div>'
    + '<button class="go" id="go" disabled>확인</button></div>';
  $('body').innerHTML = h;
  Array.prototype.forEach.call($('chips').children, function(b){
    b.onclick = function(){
      var t = b.getAttribute('data-t'), on = b.getAttribute('aria-pressed')==='true';
      b.setAttribute('aria-pressed', on?'false':'true');
      if (on) delete Q.picked[t]; else Q.picked[t] = 1;
      $('go').disabled = !Object.keys(Q.picked).length;
    };
  });
  $('go').onclick = function(){ Q.graded ? advance() : grade(); };
}
function grade(){
  Q.graded = true;
  var c = Q.cur.c, st = cardState(Q.cur.k);
  $('chips').parentNode.className = 'box done';
  var missed = [], wrong = [];
  Array.prototype.forEach.call($('chips').children, function(b){
    var t = b.getAttribute('data-t'), on = !!Q.picked[t], ans = c.t.indexOf(t) >= 0;
    b.className = 'chip ' + (ans&&on ? 'hit' : ans ? 'miss' : on ? 'bad' : '');
    if (ans && !on) missed.push(t);
    if (!ans && on) wrong.push(t);
  });
  Q.opts.forEach(function(t){
    var s = tagState(t); s.seen++;
    if ((c.t.indexOf(t)>=0) === !!Q.picked[t]) s.hit++;
  });
  missed.forEach(function(a){ wrong.forEach(function(b){
    var key = a+'\u203A'+b; S.pairs[key] = (S.pairs[key]||0)+1;
  }); });
  var ok = !missed.length && !wrong.length;
  st.seen = (st.seen || 0) + 1;
  if (ok) Q.right++;
  if (ok){ st.streak++; } else { st.streak = 0; st.wrong++; st.last = {missed:missed, wrong:wrong}; }
  save();
  $('gloss').className = 'g on';
  var msg = ok ? '<div class="hd">정확합니다</div>'
    : '<div class="hd">다시 볼 것</div>'
      + (missed.length ? '<div>놓친 것 · '+missed.map(mk).join(', ')+'</div>' : '')
      + (wrong.length ? '<div>아닌 것 · '+wrong.map(mk).join(', ')+'</div>' : '');
  $('res').innerHTML = '<div class="res '+(ok?'good':'poor')+'">'+msg
    + '<div style="margin-top:8px;font-size:15px;line-height:1.8">'+mk(c.p)+'</div>'
    + '<div style="margin-top:6px">'+mk(c.n)+'</div></div>';
  $('go').textContent = '다음';
  $('go').disabled = false;
}
function advance(){
  Q.queue.shift();
  save();
  Q.n++;
  if (!Q.queue.length) return finish();
  nextQ();
}
function finish(){
  var n = Q.session.length, r = Q.right, pct = Math.round(r / n * 100);
  var miss = Q.session.filter(function(x){ return (S.cards[x.k]||{}).streak === 0; });
  var say = pct === 100 ? '과인이 아주 흐뭇하도다' : pct >= 70 ? '제법이로다'
          : pct >= 40 ? '조금만 더 보아라' : '어엿비 여겨 다시 내어 주마';

  $('body').innerHTML = '<div class="box fin">'
    + '<div class="kingrow">' + kingImg('sm') + '<span class="bubble">' + say + '</span></div>'
    + '<div class="big">'+r+' / '+n+'</div>'
    + '<div class="tip">정답률 '+pct+'%</div>'
    + (miss.length ? '<div class="misslist">'
        + miss.map(function(x){ return '<span class="y">'+esc(x.c.f)+'</span>'; }).join('')
        + '</div>' : '')
    + '<button class="go" id="again">다시 '+n+'문항</button>'
    + '<button class="go sub" id="tonote">오답노트 보기</button></div>';
  $('again').onclick = function(){ startQuiz(Q.list, Q.label); };
  $('tonote').onclick = function(){ if (curWork){ tab='note'; renderWork(); } else home(); };
}

var C = {queue:[], cur:null, order:[], total:0, n:0, right:0, graded:false};
function conceptQuiz(){
  var all = conceptCards();
  var pend = all.filter(function(x){ return !((S.cards[x.k]||{}).streak >= 2); });
  if (!pend.length){ all.forEach(function(x){ cardState(x.k).streak = 0; }); pend = all.slice(); }
  var wrong = [], fresh = [], rest = [];
  pend.forEach(function(x){ var st = S.cards[x.k] || {};
    if (st.wrong) wrong.push(x); else if (!st.seen) fresh.push(x); else rest.push(x); });
  C.queue = shuffle(shuffle(wrong).concat(shuffle(fresh), shuffle(rest)).slice(0, SESSION));
  C.total = C.queue.length; C.n = 0; C.right = 0;
  nextC();
}
function nextC(){
  if (!C.queue.length) return finishC();
  C.cur = C.queue[0]; C.graded = false;
  var q = C.cur.q;
  // 보기 순서는 매번 섞되, 정답 위치를 기억하지 못하게 한다
  C.order = shuffle(q.opts.map(function(_, i){ return i; }));
  $('body').innerHTML = '<div class="box"><div class="qtop"><span>기본 개념</span>'
    + '<span>'+(C.n + 1)+' / '+C.total+'</span></div>'
    + '<div class="qbox">'+mk(q.q)+'</div>'
    + '<div class="mc" id="mc">'
    + C.order.map(function(i){
        return '<button data-i="'+i+'"><span class="o">'+mk(q.opts[i])+'</span>'
          + (q.sub ? '<span class="og">'+mk(q.sub[i])+'</span>' : '') + '</button>';
      }).join('')
    + '</div><div id="res"></div>'
    + '<button class="go hide" id="go">다음</button></div>';
  Array.prototype.forEach.call($('mc').children, function(b){
    b.onclick = function(){ gradeC(+b.getAttribute('data-i')); };
  });
  $('go').onclick = advanceC;
}
function gradeC(pick){
  if (C.graded) return;
  C.graded = true;
  var q = C.cur.q, st = cardState(C.cur.k), ok = pick === q.a;
  $('mc').className = 'mc done';
  Array.prototype.forEach.call($('mc').children, function(b){
    var i = +b.getAttribute('data-i');
    if (i === q.a) b.className = 'hit';
    else if (i === pick) b.className = 'bad';
  });
  st.seen = (st.seen || 0) + 1;
  if (ok){ C.right++; st.streak++; } else { st.streak = 0; st.wrong++; }
  // 개념 문제는 어절 태그 통계에 넣지 않는다. 약한 개념 목록이 오염된다.
  save();
  $('res').innerHTML = '<div class="res '+(ok?'good':'poor')+'">'
    + '<div class="hd">'+(ok?'맞았습니다':'다시 볼 것')+'</div>'+mk(q.n)+'</div>';
  $('go').className = 'go';
}
function advanceC(){ C.queue.shift(); C.n++; if (!C.queue.length) return finishC(); nextC(); }
function finishC(){
  var n = C.total || 1, pct = Math.round(C.right / n * 100);
  var say = pct === 100 ? '과인이 아주 흐뭇하도다' : pct >= 70 ? '제법이로다'
          : pct >= 40 ? '조금만 더 보아라' : '어엿비 여겨 다시 내어 주마';
  $('body').innerHTML = '<div class="box fin">'
    + '<div class="kingrow">' + kingImg('sm') + '<span class="bubble">' + say + '</span></div>'
    + '<div class="big">'+C.right+' / '+n+'</div>'
    + '<div class="tip">정답률 '+pct+'%</div>'
    + '<button class="go" id="again">다시 '+n+'문항</button>'
    + '<button class="go sub" id="toread">개념 정리 보기</button></div>';
  $('again').onclick = conceptQuiz;
  $('toread').onclick = function(){ cTab = 'read'; renderConcept(); };
}

/* ---------- 개념 모아 풀기 ---------- */
function mixed(){
  var weak = weakTags(4).map(function(x){ return x[0]; });
  var pool = allCards().filter(function(x){
    return x.c.t.some(function(t){ return weak.indexOf(t) >= 0; });
  });
  if (!pool.length) return;
  curWork = null;
  setTop(true, '약한 개념만 골라 풀기', '', home);
  V().innerHTML = '<div id="body"></div>';
  startQuiz(shuffle(pool), '약한 개념');
}

applyZoom();
drawZoomBar();
home();
</script>
